<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reel Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --paper: #f3f6f6; --sheet: #ffffff; --ink: #142326; --ink-2: #4a5d61; --rule: #d5dfe0; --accent: #0e6b6b; --bad: #a3322a;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --paper: #0f1719; --sheet: #172225; --ink: #e4eeee; --ink-2: #9db1b3; --rule: #2a3a3d; --accent: #5cc8c4; --bad: #f08a80; color-scheme: dark } }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body);
  display: grid; place-items: center; padding-inline: 16px }
form { width: min(360px, 100%); display: grid; gap: 14px; background: var(--sheet); border: 1px solid var(--rule);
  border-radius: 12px; padding: 28px 24px }
h1 { margin: 0; font: 700 1.7rem/1 var(--display) }
p { margin: 0; color: var(--ink-2); font-size: 0.93rem }
input[type=password] { font: inherit; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--paper); color: var(--ink); width: 100% }
label.rem { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--ink-2) }
button { font: 700 1rem var(--body); padding: 11px; border: 0; border-radius: 8px; background: var(--accent);
  color: var(--sheet); cursor: pointer }
button:disabled { opacity: 0.6 }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#err { color: var(--bad); min-height: 1.4em }
</style>
</head>
<body>
<form id="f">
  <h1>Reel Vault</h1>
  <p>Enter the password to open your saved gems.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Password" required autofocus>
  <label class="rem"><input id="rem" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Open</button>
  <p id="err" role="alert"></p>
</form>

const KEY = "reel-vault-pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

async function attempt(pw, remember) {
  const html = await unlock(pw);          // throws on a wrong password
  try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch (e) {}
  show(html);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
  try {
    await attempt(document.getElementById("pw").value, document.getElementById("rem").checked);
  } catch (x) {
    err.textContent = "That password didn't work. Check it and try again.";
    btn.disabled = false; btn.textContent = "Open";
  }
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { await attempt(saved, true); } catch (e) { try { localStorage.removeItem(KEY); } catch (x) {} }
  }
})();
</script>
